; PlatformIO-konfiguration for lux-sensor (ESP32-C3 SuperMini / DevKit)
; VS Code-extension: "PlatformIO IDE" (marketplace.visualstudio.com)
;
; Oppen projektet i VS Code: File -> Open Folder -> solar-lux-sensor\
; Kompilera:  klicka [Build]  (checkmark-ikonen i statusfältet)
; Flasha:     klicka [Upload] (pil-ikonen) — väljer COM-port automatiskt
; Monitor:    klicka [Monitor] (kontakt-ikonen), 115200 baud
;
; OBS: Sketch-källan ligger i lux_sensor\ — PlatformIO hittar den automatiskt.

[env:esp32c3_supermini]
platform          = espressif32
board             = esp32-c3-devkitm-1
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

; USB CDC On Boot = aktiverat (krävs for SuperMini / USB-serial via inbyggd USB)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Bibliotek (installeras automatiskt av PlatformIO)
lib_deps =
    adafruit/Adafruit TSL2591 Library @ ^1.4.7
    adafruit/Adafruit VEML7700 Library @ ^2.1.6
    adafruit/Adafruit Unified Sensor  @ ^1.1.14
    adafruit/Adafruit BusIO           @ ^1.16.1
    knolleary/PubSubClient            @ ^2.8
    bblanchon/ArduinoJson             @ ^7.0

; src_dir pekar på sketch-mappen
[platformio]
src_dir = lux_sensor
